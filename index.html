<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄列车物料自助站</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height:100vh;
  background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
  color:#e8e8ec;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px;
}
h1 {
  font-size:min(36px,8vw); font-weight:700; margin-bottom:12px;
  background:linear-gradient(135deg,#FFD700,#FFA500);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.sub { font-size:15px; color:#8b8b9e; margin-bottom:48px; }
.cards { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
.card {
  width:260px; padding:40px 28px; text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px; cursor:pointer; text-decoration:none; color:#e8e8ec;
  transition:all 0.25s ease;
}
.card:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,215,0,0.3); transform:translateY(-4px); }
.card .icon { font-size:48px; margin-bottom:16px; }
.card .title { font-size:20px; font-weight:600; margin-bottom:8px; }
.card .desc { font-size:13px; color:#8b8b9e; line-height:1.6; }
</style>
</head>
<body>
  <h1>🚂 番茄列车物料自助站</h1>
  <p class="sub">选择你的身份，开始制作专属物料</p>
  <div class="cards">
    <a class="card" href="./passenger/index.html">
      <div class="icon">🎫</div>
      <div class="title">乘客入口</div>
      <div class="desc">填写每日计划<br>生成专属日报壁纸</div>
    </a>
    <a class="card" href="./studio/index.html">
      <div class="icon">🚂</div>
      <div class="title">列车员入口</div>
      <div class="desc">上传头像 · 编辑个人信息<br>生成会议壁纸</div>
    </a>
  </div>
</body>
</html>
